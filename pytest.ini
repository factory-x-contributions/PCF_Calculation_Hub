[pytest]
markers =
    integration: tests that need a running server (e.g. LIVE_BASE_URL); skip in default CI.
    simulation: in-process FastAPI stack (TestClient), mocked externals; no live SiGREEN or AAS appliance.
# Avoid WinError 5 on pytest teardown when cleaning %TEMP%\\pytest-of-* (Cursor/antivirus locks).
addopts = --basetemp=.pytest_basetemp
# pytest-asyncio: silence asyncio_default_fixture_loop_scope deprecation warning.
asyncio_default_fixture_loop_scope = function
