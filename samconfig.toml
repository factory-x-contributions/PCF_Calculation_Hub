version = 0.1

[default.deploy.parameters]
stack_name = "pcf-fusion-app"
resolve_s3 = true
s3_prefix = "pcf-fusion-app"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
# Set BasicAuthUsername / BasicAuthPassword via `sam deploy --guided` (not stored here).
parameter_overrides = "Environment=\"dev\""
image_repositories = []

[default.global.parameters]
region = "eu-central-1"
